<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel riders — main menu</title>
<style>
:root{
  --kimi-color-text-primary:#111;
  --kimi-color-text-secondary:#444;
  --kimi-color-text-tertiary:#777;
  --kimi-color-text-quaternary:#aaa;
  --kimi-color-surface:#fff;
  --kimi-color-surface-muted:#f3f3f3;
  --kimi-color-surface-raised:#e9e9e9;
  --kimi-color-surface-strong:#dfe3e8;
  --kimi-color-border:#ddd;
  --kimi-color-danger:#e5484d;
  --kimi-color-positive:#30a46c;
  --kimi-color-warning:#f5a524;
  --kimi-color-accent:#0090ff;
  --kimi-chart-1:#0090ff;
  --kimi-chart-2:#e5484d;
  --kimi-chart-3:#30a46c;
  --kimi-chart-4:#8e4ec6;
  --kimi-chart-5:#8b8d98;
  --kimi-font-sans:ui-sans-serif,system-ui,sans-serif;
  --t-fast:120ms;
  --ease-out:cubic-bezier(.2,0,0,1);
}
@media (prefers-color-scheme: dark){
  :root{
    --kimi-color-text-primary:#eee;
    --kimi-color-text-secondary:#bbb;
    --kimi-color-text-tertiary:#888;
    --kimi-color-text-quaternary:#555;
    --kimi-color-surface:#151517;
    --kimi-color-surface-muted:#1f1f22;
    --kimi-color-surface-raised:#2a2a2e;
    --kimi-color-surface-strong:#3a3f46;
    --kimi-color-border:#333;
  }
}
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:var(--kimi-font-sans);background:var(--kimi-color-surface);color:var(--kimi-color-text-primary)}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
</style>
<base target="_blank">
</head>
<body>
<div class="wrap">
<div class="root" style="font-family:var(--kimi-font-sans)">
<style>
.root button{font:inherit}
.root .tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.screen{display:flex;flex-direction:column;gap:16px}
.titleRow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gameTitle{font-size:20px;font-weight:500;letter-spacing:0}
.coins{font-size:14px;color:var(--kimi-color-text-secondary)}
.coins b{color:var(--kimi-color-text-primary);font-weight:500}
.modeGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.modeGrid{grid-template-columns:1fr}}
.modeCard{border:1px solid var(--kimi-color-border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:background var(--t-fast) var(--ease-out)}
.modeCard:hover{background:var(--kimi-color-surface-muted)}
.modeCard.sel{border-color:var(--kimi-color-text-primary);background:var(--kimi-color-surface-muted)}
.modeName{font-size:17px;font-weight:500}
.modeDesc{font-size:14px;color:var(--kimi-color-text-secondary);line-height:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:2px 8px;border-radius:6px;border:1px solid var(--kimi-color-border);color:var(--kimi-color-text-secondary)}
.chip.on{color:var(--kimi-color-text-primary);border-color:var(--kimi-color-text-primary)}
.btn{border:none;border-radius:10px;padding:8px 16px;font-size:14px;font-weight:500;cursor:pointer;transition:opacity var(--t-fast) var(--ease-out)}
.btn.primary{background:var(--kimi-color-text-primary);color:var(--kimi-color-surface)}
.btn.ghost{background:transparent;border:1px solid var(--kimi-color-border);color:var(--kimi-color-text-primary)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel{border:1px solid var(--kimi-color-border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panelTitle{font-size:15px;font-weight:500}
.friend{display:flex;align-items:center;gap:8px;font-size:14px}
.avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--kimi-color-surface)}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.switch input{accent-color:var(--kimi-color-text-primary);width:16px;height:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--kimi-color-border)}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 12px;font-size:14px;color:var(--kimi-color-text-secondary);cursor:pointer}
.tab.on{color:var(--kimi-color-text-primary);border-bottom-color:var(--kimi-color-text-primary);font-weight:500}
.carGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.carCard{border:1px solid var(--kimi-color-border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.carCard.owned{border-color:var(--kimi-color-text-primary)}
.carName{font-size:15px;font-weight:500}
.carArt{align-self:center}
.stat{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--kimi-color-text-secondary)}
.bar{flex:1;height:6px;border-radius:3px;background:var(--kimi-color-surface-muted);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--kimi-color-text-primary)}
.partRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--kimi-color-border);border-radius:10px;flex-wrap:wrap}
.partName{font-size:14px;font-weight:500}
.partDesc{font-size:12px;color:var(--kimi-color-text-secondary)}
.meta{font-size:12px;color:var(--kimi-color-text-tertiary)}
.tag{font-size:11px;padding:1px 6px;border-radius:6px}
.speedTag{background:color-mix(in srgb,var(--kimi-chart-1) 15%,transparent);color:var(--kimi-chart-1)}
.driftTag{background:color-mix(in srgb,var(--kimi-chart-4) 15%,transparent);color:var(--kimi-chart-4)}
.muscleTag{background:color-mix(in srgb,var(--kimi-chart-2) 15%,transparent);color:var(--kimi-chart-2)}
.offTag{background:color-mix(in srgb,var(--kimi-chart-3) 15%,transparent);color:var(--kimi-chart-3)}
</style>

<div class="screen" id="menuScreen">
  <div class="titleRow">
    <div class="gameTitle">Pixel riders</div>
    <div class="coins tnum">Coins: <b id="coinCount">4,500</b></div>
  </div>

  <div class="modeGrid">
    <div class="modeCard sel" id="mpCard">
      <div class="modeName">Multiplayer</div>
      <div class="modeDesc">Race your friends in real time. Invite the lobby or challenge a rival directly.</div>
      <div class="chips" id="mpChips"></div>
      <button class="btn primary" id="mpPlay" style="align-self:flex-start">Play multiplayer</button>
    </div>
    <div class="modeCard" id="owCard">
      <div class="modeName">Open world</div>
      <div class="modeDesc">One big shared city. Anyone can join your world — cruise, race at lights, or just show off your garage.</div>
      <div class="chips" id="owChips"></div>
      <button class="btn ghost" id="owPlay" style="align-self:flex-start">Drive open world</button>
    </div>
  </div>

  <div class="row">
    <button class="btn ghost" id="toGarage">Garage &amp; dealership</button>
  </div>

  <div class="panel">
    <div class="titleRow">
      <div class="panelTitle">In the lobby</div>
      <label class="switch"><input type="checkbox" id="openWorld" checked> Anyone can join this world</label>
    </div>
    <div class="row" id="lobby"></div>
    <div class="meta" id="lobbyMeta">4 friends online</div>
  </div>
</div>

<div class="screen" id="garageScreen" style="display:none">
  <div class="titleRow">
    <div class="gameTitle">Garage</div>
    <div class="coins tnum">Coins: <b id="coinCount2">4,500</b></div>
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="garage">My cars</button>
    <button class="tab" data-tab="dealer">Dealership</button>
    <button class="tab" data-tab="parts">Parts shop</button>
  </div>
  <div id="tabBody" style="display:flex;flex-direction:column;gap:12px"></div>
  <button class="btn ghost" id="backBtn" style="align-self:flex-start">Back to menu</button>
</div>

<script>
const CARS=[
 {id:'pocket',name:'Pocket rocket',cls:'starter',body:'var(--kimi-chart-5)',price:0,spd:34,acc:52,hnd:60,owned:true},
 {id:'fox',name:'Street fox',cls:'speed',body:'var(--kimi-chart-1)',price:1200,spd:52,acc:48,hnd:55},
 {id:'drift',name:'Drift king',cls:'drift',body:'var(--kimi-chart-4)',price:1800,spd:46,acc:44,hnd:82},
 {id:'muscle',name:'Muscle v8',cls:'muscle',body:'var(--kimi-chart-2)',price:2600,spd:62,acc:38,hnd:40},
 {id:'rally',name:'Rally beast',cls:'offroad',body:'var(--kimi-chart-3)',price:3400,spd:55,acc:58,hnd:70},
 {id:'hyper',name:'Hyper one',cls:'speed',body:'var(--kimi-chart-1)',price:5200,spd:88,acc:74,hnd:62},
];
const PARTS=[
 {id:'turbo',name:'Turbo kit',desc:'+12 speed',price:900},
 {id:'nitro',name:'Nitro tank',desc:'+15 acceleration',price:750},
 {id:'tires',name:'Racing tires',desc:'+10 handling',price:600},
 {id:'wing',name:'GT wing',desc:'+6 handling, looks fast',price:450},
 {id:'tune',name:'Engine tune',desc:'+8 speed, +5 acceleration',price:1100},
];
let coins=4500, partsOwned=[];
const FRIENDS=[['M','var(--kimi-chart-1)'],['Z','var(--kimi-chart-2)'],['K','var(--kimi-chart-4)'],['A','var(--kimi-chart-3)']];
const CLSTAG={starter:'',speed:['speedTag','speed'],drift:['driftTag','drift'],muscle:['muscleTag','muscle'],offroad:['offTag','offroad']};

const PIX=[
"......cc........",
"....cccccc......",
"...ccccccccc....",
"..gggggggggg....",
".ggggggggggggg..",
".hggggggggggggt.",
".gggggggggggggg.",
"..kk........kk..",
"..kk........kk.."];

function carSVG(body,scale){
 scale=scale||6; const cols=16, rows=PIX.length;
 let r=''; const m={c:body,g:'var(--kimi-color-surface-strong)',h:'var(--kimi-color-warning)',t:'var(--kimi-color-danger)',k:'var(--kimi-color-text-primary)'};
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const ch=PIX[y][x]; if(m[ch]) r+='<rect x="'+(x*scale)+'" y="'+(y*scale)+'" width="'+scale+'" height="'+scale+'" fill="'+m[ch]+'"/>';}
 return '<svg class="carArt" width="'+(cols*scale)+'" height="'+(rows*scale)+'" viewBox="0 0 '+(cols*scale)+' '+(rows*scale)+'" shape-rendering="crispEdges">'+r+'</svg>';
}
function fmt(n){return n.toLocaleString('en-US');}
function refreshCoins(){['coinCount','coinCount2'].forEach(id=>{const e=document.getElementById(id); if(e)e.textContent=fmt(coins);});}

document.getElementById('mpChips').innerHTML=['Race','Drift battle','Tag','Time attack'].map((m,i)=>'<span class="chip'+(i===0?' on':'')+'">'+m+'</span>').join('');
document.getElementById('owChips').innerHTML=['City cruise','Meetup spot','Highway loop','Stunt park'].map((m,i)=>'<span class="chip'+(i===0?' on':'')+'">'+m+'</span>').join('');
document.getElementById('lobby').innerHTML=FRIENDS.map(f=>'<div class="friend"><div class="avatar" style="background:'+f[1]+'">'+f[0]+'</div></div>').join('');

document.getElementById('mpCard').onclick=()=>select('mpCard','owCard');
document.getElementById('owCard').onclick=()=>select('owCard','mpCard');
function select(a,b){document.getElementById(a).classList.add('sel');document.getElementById(b).classList.remove('sel');}

document.getElementById('mpPlay').onclick=()=>{ if(window.sendPrompt) window.sendPrompt('Start a multiplayer race with my friends in Pixel riders'); };
document.getElementById('owPlay').onclick=()=>{ if(window.sendPrompt) window.sendPrompt('Drive into the open world city, anyone can join'); };
document.getElementById('openWorld').onchange=e=>{document.getElementById('lobbyMeta').textContent=e.target.checked?'4 friends online · world is open to everyone':'4 friends online · invite only';};

function statRow(label,val){return '<div class="stat"><span style="width:34px">'+label+'</span><div class="bar"><i style="width:'+val+'%"></i></div></div>';}

function carCard(c,dealer){
 const owned=c.owned, afford=coins>=c.price, tag=CLSTAG[c.cls]&&CLSTAG[c.cls][0]?'<span class="tag '+CLSTAG[c.cls][0]+'">'+CLSTAG[c.cls][1]+'</span>':'<span class="tag">starter</span>';
 let btn;
 if(owned) btn='<button class="btn ghost" disabled style="align-self:flex-start">In your garage</button>';
 else btn='<button class="btn primary" data-buy="'+c.id+'" '+(afford?'':'disabled')+' style="align-self:flex-start">Buy &middot; '+fmt(c.price)+'</button>';
 return '<div class="carCard'+(owned?' owned':'')+'"><div class="row" style="justify-content:space-between"><div class="carName">'+c.name+'</div>'+tag+'</div>'+carSVG(c.body)+statRow('spd',c.spd)+statRow('acc',c.acc)+statRow('hnd',c.hnd)+btn+'</div>';
}

function renderTab(tab){
 const body=document.getElementById('tabBody');
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));
 if(tab==='garage'){
  const mine=CARS.filter(c=>c.owned);
  body.innerHTML='<div class="meta">'+mine.length+' car'+(mine.length>1?'s':'')+' owned · buy more at the dealership</div><div class="carGrid">'+mine.map(c=>carCard(c)).join('')+'</div>';
 }else if(tab==='dealer'){
  const notMine=CARS.filter(c=>!c.owned);
  body.innerHTML='<div class="meta">Fresh stock — earn coins by winning races</div><div class="carGrid">'+notMine.map(c=>carCard(c,true)).join('')+'</div>';
 }else{
  body.innerHTML=PARTS.map(p=>{
   const owned=partsOwned.includes(p.id);
   return '<div class="partRow"><div><div class="partName">'+p.name+'</div><div class="partDesc">'+p.desc+'</div></div>'+(owned?'<button class="btn ghost" disabled>Installed</button>':'<button class="btn primary" data-part="'+p.id+'" '+(coins>=p.price?'':'disabled')+'>Buy &middot; '+fmt(p.price)+'</button>')+'</div>';
  }).join('');
 }
 body.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{
  const c=CARS.find(x=>x.id===b.dataset.buy);
  if(coins>=c.price){coins-=c.price;c.owned=true;refreshCoins();renderTab('dealer');}
 });
 body.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{
  const p=PARTS.find(x=>x.id===b.dataset.part);
  if(coins>=p.price){coins-=p.price;partsOwned.push(p.id);refreshCoins();renderTab('parts');}
 });
}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>renderTab(t.dataset.tab));
document.getElementById('toGarage').onclick=()=>{document.getElementById('menuScreen').style.display='none';document.getElementById('garageScreen').style.display='flex';renderTab('garage');};
document.getElementById('backBtn').onclick=()=>{document.getElementById('garageScreen').style.display='none';document.getElementById('menuScreen').style.display='flex';};
</script>
</div>
</div>
</body>
</html>
