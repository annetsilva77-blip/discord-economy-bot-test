
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>StreetWorld 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#071321;color:white;font-family:Arial}
#game{position:fixed;inset:0}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.panel{background:#07111ddd;padding:10px;border:1px solid #ffffff33;border-radius:12px}
#speed{font-size:22px;font-weight:bold}
#online{color:#65edb0;font-size:12px}
#menu{position:fixed;inset:0;background:#061321ee;display:grid;place-items:center;z-index:5;padding:20px}
#card{width:min(400px,100%);background:#102236;padding:25px;border-radius:18px;border:1px solid #ffffff33}
h1{font-size:36px;margin:8px 0}
input{width:100%;padding:13px;margin:8px 0 14px;background:#071321;color:white;border:1px solid #ffffff44;border-radius:9px}
button{border:0;border-radius:10px;padding:13px;background:#10bfd1;color:#00151b;font-weight:bold;cursor:pointer}
#join{width:100%}
#err{color:#ffaaaa;font-size:12px}
#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 15px;pointer-events:none}
.pad{display:flex;gap:8px;pointer-events:auto}
.ctrl{width:60px;height:60px;background:#07111ddd;color:white;border:1px solid #ffffff55;font-size:20px;touch-action:none}
#hint{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);font-size:11px;background:#07111ddd;padding:8px;border-radius:20px;white-space:nowrap}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div class="panel">SPEED<br><span id="speed">0</span> KM/H</div>
 <div class="panel">PUBLIC WORLD<br><span id="count">1</span> PLAYERS<br><span id="online">Connecting...</span></div>
</div>

<div id="hint">WASD / ARROWS · Mobile controls below</div>

<div id="controls">
 <div class="pad">
  <button class="ctrl" id="left">◀</button>
  <button class="ctrl" id="right">▶</button>
 </div>
 <div class="pad">
  <button class="ctrl" id="brake">BRAKE</button>
  <button class="ctrl" id="gas">GAS</button>
 </div>
</div>

<div id="menu">
 <div id="card">
  <div style="color:#50e6ed;letter-spacing:3px">PUBLIC MULTIPLAYER</div>
  <h1>STREETWORLD<br><span style="color:#30d9e8">3D</span></h1>
  <p>Join the shared world and drive with everyone!</p>
  <input id="name" maxlength="16" placeholder="Your driver name" value="Driver">
  <button id="join">JOIN PUBLIC WORLD</button>
  <p id="err"></p>
 </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
const SERVER_URL = "PASTE_YOUR_SERVER_URL_HERE";
</script>
<script>
(function(){
const $=id=>document.getElementById(id);

function loadThree(urls,done){
 let i=0;
 function next(){
  if(window.THREE){done();return}
  if(i===urls.length){
   $('err').textContent='3D engine failed to load. Check your internet connection.';
   return;
  }
  const s=document.createElement('script');
  s.src=urls[i++];
  s.onload=()=>window.THREE?done():next();
  s.onerror=next;
  document.head.appendChild(s);
 }
 next();
}

loadThree([
 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js',
 'https://unpkg.com/three@0.160.0/build/three.min.js'
],startGame);

function startGame(){
 const T=THREE;
 const scene=new T.Scene();
 scene.background=new T.Color(0x8bc5e8);
 scene.fog=new T.Fog(0x8bc5e8,65,250);

 const camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,600);
 const renderer=new T.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.shadowMap.enabled=true;
 $('game').appendChild(renderer.domElement);

 scene.add(new T.HemisphereLight(0xdaf2ff,0x526044,2));

 const sun=new T.DirectionalLight(0xfff0d5,2.5);
 sun.position.set(-30,60,-30);
 sun.castShadow=true;
 scene.add(sun);

 const material=c=>new T.MeshStandardMaterial({color:c});
 const ground=new T.Mesh(
  new T.PlaneGeometry(1200,1200),
  material(0x527344)
 );
 ground.rotation.x=-Math.PI/2;
 ground.position.y=-.15;
 scene.add(ground);

 const roadMat=material(0x252a30);
 const white=material(0xf2eddd);

 function road(x,z,w,d){
  const r=new T.Mesh(new T.PlaneGeometry(w,d),roadMat);
  r.rotation.x=-Math.PI/2;
  r.position.set(x,-.08,z);
  scene.add(r);

  const horizontal=w>d;
  const length=horizontal?w:d;

  for(let p=-length/2;p<length/2;p+=13){
   const dash=new T.Mesh(
    new T.PlaneGeometry(horizontal?4:.13,horizontal?.13:4),
    white
   );
   dash.rotation.x=-Math.PI/2;
   dash.position.set(
    x+(horizontal?p:0),-.06,
    z+(horizontal?0:p)
   );
   scene.add(dash);
  }
 }

 for(let i=-6;i<=6;i++){
  road(i*65,0,12,1200);
  road(0,i*65,1200,12);
 }

 const treeMaterial=material(0x28613b);
 const trunkMaterial=material(0x63452c);

 for(let i=0;i<250;i++){
  const x=(Math.random()-.5)*1000;
  const z=(Math.random()-.5)*1000;

  if(Math.abs(x%65)<13||Math.abs(z%65)<13)continue;

  const trunk=new T.Mesh(
   new T.CylinderGeometry(.2,.28,2,7),
   trunkMaterial
  );
  trunk.position.set(x,1,z);
  scene.add(trunk);

  const leaves=new T.Mesh(
   new T.ConeGeometry(1.6,3.5,7),
   treeMaterial
  );
  leaves.position.set(x,3,z);
  scene.add(leaves);
 }

 for(let i=0;i<100;i++){
  const x=(Math.random()-.5)*950;
  const z=(Math.random()-.5)*950;

  if(Math.abs(x%65)<13||Math.abs(z%65)<13)continue;

  const h=8+Math.random()*24;
  const building=new T.Mesh(
   new T.BoxGeometry(8+Math.random()*8,h,9),
   material([0x89969c,0xb9b09e,0x596b76][i%3])
  );
  building.position.set(x,h/2,z);
  scene.add(building);
 }

 function makeCar(color){
  const g=new T.Group();
  const body=material(color);
  const glass=material(0x193447);
  const black=material(0x111419);

  function box(w,h,d,m,x,y,z){
   const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);
   o.position.set(x,y,z);
   o.castShadow=true;
   g.add(o);
   return o;
  }

  box(2,.65,4,body,0,.7,0);
  box(1.5,.75,1.8,glass,0,1.35,.1);
  box(1.5,.1,1.4,body,0,1.75,.1);

  const wheels=[];

  for(const x of [-1,1]){
   for(const z of [-1.3,1.3]){
    const w=new T.Mesh(
     new T.CylinderGeometry(.4,.4,.28,16),
     black
    );
    w.rotation.z=Math.PI/2;
    w.position.set(x,.42,z);
    g.add(w);
    wheels.push(w);
   }
  }

  g.userData.wheels=wheels;
  return g;
 }

 const car=makeCar(0x08a9d0);
 scene.add(car);
 car.position.set(0,0,3);

 const others=new Map();
 let socket=null;
 let joined=false;
 let speed=0;
 let steering=0;

 const keys={left:false,right:false,gas:false,brake:false};

 function hold(id,key){
  const el=$(id);
  el.addEventListener('pointerdown',e=>{
   e.preventDefault();
   el.setPointerCapture(e.pointerId);
   keys[key]=true;
  });
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>{
   el.addEventListener(ev,()=>keys[key]=false);
  });
 }

 hold('left','left');
 hold('right','right');
 hold('gas','gas');
 hold('brake','brake');

 addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='a'||k==='arrowleft')keys.left=true;
  if(k==='d'||k==='arrowright')keys.right=true;
  if(k==='w'||k==='arrowup')keys.gas=true;
  if(k==='s'||k==='arrowdown'||k===' ')keys.brake=true;
 });

 addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k==='a'||k==='arrowleft')keys.left=false;
  if(k==='d'||k==='arrowright')keys.right=false;
  if(k==='w'||k==='arrowup')keys.gas=false;
  if(k==='s'||k==='arrowdown'||k===' ')keys.brake=false;
 });

 function addPlayer(p){
  if(!p||p.id===socket.id)return;
  if(others.has(p.id))return;

  const c=makeCar(p.color||0xe6a52d);
  scene.add(c);
  others.set(p.id,c);
  movePlayer(p);
 }

 function movePlayer(p){
  const c=others.get(p.id);
  if(!c)return;
  c.position.set(p.x||0,0,p.z||0);
  c.rotation.y=p.rot||0;
 }

 function removePlayer(id){
  const c=others.get(id);
  if(c){
   scene.remove(c);
   others.delete(id);
  }
 }

 $('join').onclick=()=>{
  if(!SERVER_URL.startsWith('http')){
   $('err').textContent='The game owner needs to configure the server URL first.';
   return;
  }

  if(!window.io){
   $('err').textContent='Multiplayer library did not load. Check internet.';
   return;
  }

  $('join').disabled=true;
  $('err').textContent='Connecting to public world...';

  socket=io(SERVER_URL);

  socket.on('connect',()=>{
   joined=true;
   $('menu').style.display='none';
   $('online').textContent='ONLINE';
   socket.emit('joinWorld',{
    name:$('name').value.trim().slice(0,16)||'Driver'
   });
  });

  socket.on('connect_error',()=>{
   $('join').disabled=false;
   $('err').textContent='Could not connect. The public server may be offline.';
  });

  socket.on('players',list=>{
   list.forEach(addPlayer);
   $('count').textContent=others.size+1;
  });

  socket.on('playerJoined',p=>{
   addPlayer(p);
   $('count').textContent=others.size+1;
  });

  socket.on('playerMoved',movePlayer);

  socket.on('playerLeft',id=>{
   removePlayer(id);
   $('count').textContent=others.size+1;
  });
 };

 let last=performance.now();
 let sendTimer=0;

 function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min((now-last)/1000,.04);
  last=now;

  if(joined){
   if(keys.gas)speed=Math.min(45,speed+18*dt);
   else speed=Math.max(0,speed-3*dt);

   if(keys.brake)speed=Math.max(0,speed-32*dt);

   const direction=(keys.right?1:0)-(keys.left?1:0);
   steering=T.MathUtils.damp(steering,direction,5,dt);

   car.position.x+=steering*(1.8+speed*.07)*dt;
   car.position.z-=Math.cos(car.rotation.y)*speed*dt*.42;

   car.rotation.y=T.MathUtils.damp(
    car.rotation.y,-steering*.22,4,dt
   );

   car.userData.wheels.forEach(w=>{
    w.rotation.x-=speed*dt*.2;
   });

   sendTimer+=dt;

   if(socket&&socket.connected&&sendTimer>.06){
    sendTimer=0;
    socket.emit('move',{
     x:car.position.x,
     z:car.position.z,
     rot:car.rotation.y
    });
   }
  }

  $('speed').textContent=Math.round(speed*3.6);

  camera.position.lerp(
   new T.Vector3(car.position.x,5.2,car.position.z+10),.09
  );
  camera.lookAt(car.position.x,1,car.position.z-11);

  renderer.render(scene,camera);
 }

 requestAnimationFrame(animate);

 addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
 });
}
})();
</script>
</body>
</html>
