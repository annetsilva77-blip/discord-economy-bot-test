<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bot Shop & Race Background Admin</title>
  <style>
    body {
      font-family: sans-serif;
      background: #12151f;
      color: #ffffff;
      padding: 20px;
      max-width: 720px;
      margin: auto;
    }
    .box {
      background: #1c2130;
      border: 1px solid #353e59;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 20px;
    }
    h2 {
      margin-top: 0;
      color: #a29bfe;
    }
    label {
      font-size: 14px;
      color: #dfe6e9;
    }
    input, button {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      margin-bottom: 14px;
      border-radius: 6px;
      border: none;
      box-sizing: border-box;
      font-size: 14px;
    }
    input {
      background: #262d42;
      color: #ffffff;
    }
    button {
      background: #6c5ce7;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      filter: brightness(1.1);
    }
    .btn-bg {
      background: #00b894;
      color: #000000;
    }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #2d354d;
    }
    img {
      max-height: 55px;
      border-radius: 6px;
    }
    .preview-box {
      margin-top: 10px;
      padding: 10px;
      background: #141824;
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>🛒 Add Item or Car to Shop</h2>
    <form method="POST" enctype="multipart/form-data">
      <input type="hidden" name="form_type" value="item" />
      <label>Item / Car Name (e.g. BMW M4, Nissan GT-R, Bugatti Chiron)</label>
      <input type="text" name="name" placeholder="BMW M4" required />
      <label>Price (Coins)</label>
      <input type="number" name="price" placeholder="5000" required />
      <label>Item Image (Optional)</label>
      <input type="file" name="image" accept="image/*" />
      <button type="submit">➕ Add to Shop</button>
    </form>
  </div>

  <div class="box">
    <h2>🏁 Custom Pixel Race Background</h2>
    <form method="POST" enctype="multipart/form-data">
      <input type="hidden" name="form_type" value="background" />
      <label>Upload Background Image (PNG / JPG / GIF / WEBP)</label>
      <input type="file" name="bg_image" accept="image/*" />
      <label>Or Paste Direct Image URL</label>
      <input type="url" name="bg_url" placeholder="https://example.com" value="{{ bg_url }}" />
      <button type="submit" class="btn-bg">🖼️ Save Race Background</button>
    </form>
    {% if bg_url %}
      <div class="preview-box">
        <strong>Current Active Race Background:</strong><br />
        <img src="{{ bg_url }}" style="max-height: 120px; margin-top: 8px;" alt="Race Background" />
      </div>
    {% endif %}
  </div>

  <div class="box">
    <h2>📦 Current Shop Items</h2>
    {% for item in shop_items %}
      <div class="item">
        <div><strong>{{ item.name }}</strong> — {{ item.price }} coins</div>
        {% if item.image_url %}
          <img src="{{ item.image_url }}" alt="{{ item.name }}" />
        {% endif %}
      </div>
    {% else %}
      <p>No items in shop yet.</p>
    {% endfor %}
  </div>
</body>
</html>
