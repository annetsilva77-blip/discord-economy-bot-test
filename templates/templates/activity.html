<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economy Bot Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #23272a; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #2c2f33; }
        th { background-color: #7289da; }
        .form-group { margin-bottom: 15px; }
        input, button { padding: 8px; margin-right: 10px; }
        button { background: #7289da; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Economy Bot Activity Dashboard</h1>
        
        <div class="admin-panel">
            <h3>Admin Tools</h3>
            <div class="form-group">
                <input type="text" id="userId" placeholder="User ID">
                <input type="number" id="amount" placeholder="Amount">
                <button onclick="addMoney()">Add Money</button>
            </div>
        </div>

        <h2>Leaderboard / User Activity</h2>
        <table>
            <thead>
                <tr>
                    <th>User ID</th>
                    <th>Wallet Balance</th>
                    <th>Bank Balance</th>
                </tr>
            </thead>
            <tbody id="economy-table">
                <!-- Data injected dynamically -->
            </tbody>
        </table>
    </div>

    <script>
        async function loadData() {
            const res = await fetch('/api/economy');
            const result = await res.json();
            if (result.status === 'success') {
                const tbody = document.getElementById('economy-table');
                tbody.innerHTML = '';
                result.data.forEach(user => {
                    const row = `<tr>
                        <td>${user.user_id}</td>
                        <td>${user.balance}</td>
                        <td>${user.bank}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            }
        }

        async function addMoney() {
            const userId = document.getElementById('userId').value;
            const amount = document.getElementById('amount').value;
            
            const res = await fetch('/api/admin/addmoney', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, amount: amount })
            });
            
            const result = await res.json();
            if (result.status === 'success') {
                loadData();
            } else {
                alert('Error updating balance: ' + result.message);
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
