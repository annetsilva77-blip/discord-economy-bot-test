
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StreetWorld 3D</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
#game{position:fixed;inset:0}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;color:white;z-index:5;background:#111b;padding:12px;border-radius:12px;font-size:13px}
#hud strong{font-size:17px}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0009;z-index:10}
.panel{width:min(340px,90%);padding:24px;background:#171c25;color:white;border:1px solid #ffffff30;border-radius:18px;text-align:center}
.panel h1{margin:0 0 8px;font-size:27px}
.panel p{color:#b9c1ce;font-size:13px}
input{width:100%;padding:13px;border:0;border-radius:9px;margin:12px 0;background:#303947;color:white;font-size:16px}
button{border:0;border-radius:9px;padding:12px 18px;background:#16a56a;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
#err{color:#ff7777;font-size:12px;min-height:18px;margin-top:10px}
#controls{position:fixed;bottom:22px;left:0;right:0;display:none;justify-content:space-between;padding:0 22px;z-index:6;pointer-events:none}
.control-group{display:flex;gap:12px;pointer-events:auto}
.drive-btn{width:65px;height:65px;border-radius:50%;background:#17202dcc;border:2px solid #ffffff70;color:white;font-size:24px;touch-action:none}
#gas{background:#0b9c5dcc}
#brake{background:#bd3535cc}
#leave{position:fixed;top:12px;right:12px;z-index:7;display:none;background:#a83232}
#speed{font-size:18px;color:#69f0ae}
#help{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);color:white;background:#111a;padding:7px 12px;border-radius:8px;font-size:11px;z-index:4;white-space:nowrap}
</style>
</head>

<body>
<div id="game"></div>

<div id="hud">
  <strong>🌍 StreetWorld 3D</strong><br>
  <span id="status">Not connected</span><br>
  <span id="speed">0 km/h</span><br>
  <span id="players">Players: 1</span>
</div>

<button id="leave">Leave world</button>

<div id="menu">
  <div class="panel">
    <h1>🏎️ StreetWorld</h1>
    <p>Explore the open world and drive with other players.</p>
    <input id="playerName" maxlength="16" placeholder="Enter your driver name" value="Driver">
    <button id="join" style="width:100%">JOIN WORLD</button>
    <div id="err"></div>
  </div>
</div>

<div id="controls">
  <div class="control-group">
    <button class="drive-btn" id="left">◀</button>
    <button class="drive-btn" id="right">▶</button>
  </div>
  <div class="control-group">
    <button class="drive-btn" id="brake">▼</button>
    <button class="drive-btn" id="gas">▲</button>
  </div>
</div>

<div id="help">WASD / Arrow keys to drive · Mobile touch controls available</div>

<!-- Socket.IO fallback loader: waits for a working CDN before enabling multiplayer -->
<script>
window.socketIoReady = new Promise((resolve, reject) => {
  const sources = [
    "https://cdn.socket.io/4.8.1/socket.io.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.min.js"
  ];

  function loadSource(index) {
    if (index >= sources.length) {
      reject(new Error("Could not load Socket.IO from either CDN"));
      return;
    }

    const script = document.createElement("script");
    script.src = sources[index];
    script.async = true;

    script.onload = () => {
      if (typeof window.io === "function") {
        resolve(window.io);
      } else {
        script.remove();
        loadSource(index + 1);
      }
    };

    script.onerror = () => {
      script.remove();
      loadSource(index + 1);
    };

    document.head.appendChild(script);
  }

  loadSource(0);
});
</script>

<script type="module">
const SERVER_URL = "https://discord-economy-bot-test.onrender.com";

const $ = id => document.getElementById(id);

let scene, camera, renderer, car;
let socket = null;
let joined = false;
let speed = 0;
let steering = 0;
let gas = false;
let braking = false;
let left = false;
let right = false;
let lastNetworkUpdate = 0;

const otherPlayers = new Map();
const keys = {};

function setStatus(text) {
  $("status").textContent = text;
}

function setError(text) {
  $("err").textContent = text;
}

function makeMaterial(color) {
  return new THREE.MeshStandardMaterial({color, roughness:0.8});
}

function box(parent, x,y,z, sx,sy,sz, color) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(sx,sy,sz),
    makeMaterial(color)
  );
  mesh.position.set(x,y,z);
  parent.add(mesh);
  return mesh;
}

function makeCar(color=0xff3030) {
  const group = new THREE.Group();

  box(group,0,0.55,0,1.8,0.55,3.4,color);
  box(group,0,1.02,-0.25,1.5,0.65,1.65,0x222c3b);

  const glass = new THREE.MeshStandardMaterial({
    color:0x75bde8,metalness:0.2,roughness:0.2
  });

  const windowMesh = new THREE.Mesh(
    new THREE.BoxGeometry(1.38,0.48,1.5),
    glass
  );
  windowMesh.position.set(0,1.06,-0.25);
  group.add(windowMesh);

  const wheelMat = makeMaterial(0x151515);
  for(const x of [-0.95,0.95]) {
    for(const z of [-1.05,1.05]) {
      const wheel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.39,0.39,0.22,16),
        wheelMat
      );
      wheel.rotation.z = Math.PI/2;
      wheel.position.set(x,0.38,z);
      group.add(wheel);
    }
  }

  const headMat = makeMaterial(0xffffcc);
  box(group,-0.58,0.63,1.72,0.35,0.2,0.08,0xffffcc);
  box(group,0.58,0.63,1.72,0.35,0.2,0.08,0xffffcc);

  return group;
}

function createWorld() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8dc7ed);
  scene.fog = new THREE.Fog(0x8dc7ed,100,500);

  camera = new THREE.PerspectiveCamera(
    70, window.innerWidth/window.innerHeight,0.1,1000
  );

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled = true;
  $("game").appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff,0x506040,2));

  const sun = new THREE.DirectionalLight(0xffffff,2);
  sun.position.set(80,120,50);
  sun.castShadow = true;
  scene.add(sun);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(1000,1000),
    makeMaterial(0x47834b)
  );
  ground.rotation.x=-Math.PI/2;
  ground.position.y=-0.08;
  scene.add(ground);

  // Main road
  box(scene,0,0,-0,16,0.08,1000,0x34383d);

  // Road markings
  for(let z=-490;z<500;z+=12) {
    box(scene,0,0.06,z,0.25,0.02,6,0xffffff);
  }

  // Side roads
  box(scene,80,0,0,12,0.08,1000,0x34383d);
  box(scene,-80,0,0,12,0.08,1000,0x34383d);

  // Buildings
  for(let i=0;i<100;i++) {
    const side = Math.random()<0.5 ? -1:1;
    const x = side*(20+Math.random()*100);
    const z = Math.random()*900-450;
    const h = 8+Math.random()*35;
    const w = 8+Math.random()*16;
    const d = 8+Math.random()*18;
    const colors=[0x9b9b9b,0xb5a18a,0x777f8a,0xc5c1b7,0x8b9b9d];

    const building = box(scene,x,h/2,z,w,h,d,
      colors[Math.floor(Math.random()*colors.length)]);

    building.position.y=h/2;
  }

  // Trees
  for(let i=0;i<180;i++) {
    const x=(Math.random()<0.5?-1:1)*(12+Math.random()*160);
    const z=Math.random()*950-475;

    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.3,0.4,3,8),
      makeMaterial(0x654321)
    );
    trunk.position.set(x,1.5,z);
    scene.add(trunk);

    const leaves = new THREE.Mesh(
      new THREE.SphereGeometry(2.2,8,8),
      makeMaterial(0x176b35)
    );
    leaves.position.set(x,4,z);
    scene.add(leaves);
  }

  car = makeCar(0xff3030);
  car.position.set(0,0,0);
  scene.add(car);

  camera.position.set(0,6,-11);
  camera.lookAt(car.position);

  window.addEventListener("resize",resize);
  animate();
}

function resize() {
  if(!camera || !renderer)return;
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);

  if(car) {
    const forward = new THREE.Vector3(
      Math.sin(car.rotation.y),0,Math.cos(car.rotation.y)
    );

    const steeringInput = (right||keys.ArrowRight||keys.d?1:0)
      -(left||keys.ArrowLeft||keys.a?1:0);

    const accelerating = gas||keys.ArrowUp||keys.w;
    const reversing = braking||keys.ArrowDown||keys.s;

    if(accelerating) speed=Math.min(speed+0.12,1.7);
    else if(reversing) speed=Math.max(speed-0.18,-0.65);
    else speed*=0.985;

    if(Math.abs(speed)>0.02) {
      car.rotation.y += steeringInput*0.035*(speed>0?1:-1);
    }

    car.position.addScaledVector(forward,speed);

    $("speed").textContent=Math.round(Math.abs(speed)*75)+" km/h";

    const targetCamera = new THREE.Vector3(
      car.position.x-Math.sin(car.rotation.y)*10,
      car.position.y+6,
      car.position.z-Math.cos(car.rotation.y)*10
    );

    camera.position.lerp(targetCamera,0.09);
    camera.lookAt(car.position.x,car.position.y+1,car.position.z);

    if(joined && socket && socket.connected &&
       performance.now()-lastNetworkUpdate>80) {
      lastNetworkUpdate=performance.now();
      socket.emit("move",{
        x:car.position.x,
        z:car.position.z,
        rot:car.rotation.y
      });
    }
  }

  renderer.render(scene,camera);
}

function addPlayer(p) {
  if(!p || !p.id || otherPlayers.has(p.id))return;

  const playerCar=makeCar(p.color || 0x3388ff);
  playerCar.position.set(Number(p.x)||0,0,Number(p.z)||0);
  playerCar.rotation.y=Number(p.rot)||0;
  scene.add(playerCar);

  otherPlayers.set(p.id,{car:playerCar,name:p.name||"Driver"});
  updatePlayerCount();
}

function movePlayer(p) {
  if(!p || !p.id)return;

  let player=otherPlayers.get(p.id);
  if(!player) {
    addPlayer(p);
    player=otherPlayers.get(p.id);
  }
  if(!player)return;

  player.car.position.x=Number(p.x)||0;
  player.car.position.z=Number(p.z)||0;
  player.car.rotation.y=Number(p.rot)||0;
}

function removePlayer(id) {
  const player=otherPlayers.get(id);
  if(!player)return;
  scene.remove(player.car);
  otherPlayers.delete(id);
  updatePlayerCount();
}

function updatePlayerCount() {
  $("players").textContent="Players: "+(1+otherPlayers.size);
}

async function joinWorld() {
  if(joined)return;

  $("join").disabled=true;
  setError("Loading multiplayer library...");
  setStatus("Loading...");

  let ioFunction;

  try {
    ioFunction=await window.socketIoReady;
  } catch(error) {
    $("join").disabled=false;
    setStatus("Offline");
    setError("Socket.IO library failed to load. Try another network or refresh.");
    console.error(error);
    return;
  }

  setError("Connecting to server...");
  setStatus("Connecting...");

  try {
    socket=ioFunction(SERVER_URL,{
      transports:["websocket","polling"],
      reconnection:true,
      timeout:15000
    });

    socket.on("connect",()=>{
      joined=true;
      setStatus("Connected");
      setError("");
      $("menu").style.display="none";
      $("controls").style.display="flex";
      $("leave").style.display="block";
      $("help").style.display="block";

      socket.emit("joinWorld",{
        name:$("playerName").value.trim()||"Driver"
      });
    });

    socket.on("connect_error",error=>{
      setStatus("Connection failed");
      setError("Server connection failed: "+error.message);
      $("join").disabled=false;
      console.error(error);
    });

    socket.on("players",list=>{
      if(Array.isArray(list))list.forEach(addPlayer);
    });

    socket.on("playerJoined",addPlayer);
    socket.on("playerMoved",movePlayer);
    socket.on("playerLeft",removePlayer);

    socket.on("disconnect",()=>{
      joined=false;
      setStatus("Disconnected");
      $("controls").style.display="none";
      $("leave").style.display="none";
      $("menu").style.display="flex";
      $("join").disabled=false;

      for(const id of [...otherPlayers.keys()])removePlayer(id);
    });

  } catch(error) {
    setStatus("Error");
    setError(error.message);
    $("join").disabled=false;
  }
}

function leaveWorld() {
  if(socket) {
    socket.disconnect();
    socket=null;
  }
  joined=false;
  $("menu").style.display="flex";
  $("controls").style.display="none";
  $("leave").style.display="none";
  $("join").disabled=false;
  setStatus("Not connected");
}

$("join").addEventListener("click",joinWorld);
$("leave").addEventListener("click",leaveWorld);

// Keyboard controls
window.addEventListener("keydown",e=>{
  keys[e.key]=true;
});
window.addEventListener("keyup",e=>{
  keys[e.key]=false;
});

// Mobile touch controls
function holdButton(id,callback) {
  const element=$(id);
  element.addEventListener("pointerdown",e=>{
    e.preventDefault();
    callback(true);
  });
  element.addEventListener("pointerup",()=>callback(false));
  element.addEventListener("pointerleave",()=>callback(false));
  element.addEventListener("pointercancel",()=>callback(false));
}

holdButton("gas",v=>gas=v);
holdButton("brake",v=>braking=v);
holdButton("left",v=>left=v);
holdButton("right",v=>right=v);

// Load Three.js
async function loadThree() {
  const sources=[
    "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "https://esm.sh/three@0.160.0",
    "https://unpkg.com/three@0.160.0/build/three.module.js"
  ];

  for(const url of sources) {
    try {
      const module=await import(url);
      window.THREE=module;
      return module;
    } catch(error) {
      console.warn("Three.js source failed:",url,error);
    }
  }

  throw new Error("3D engine failed to load. Check your internet connection.");
}

try {
  window.THREE=await loadThree();
  createWorld();
  setStatus("Ready to drive");
} catch(error) {
  setError(error.message);
  $("menu").style.display="flex";
  console.error(error);
}
</script>
</body>
</html>
